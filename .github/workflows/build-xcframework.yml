name: Build XCFramework

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. mate-1.0.0)"
        required: true
  push:
    paths:
      - "mate/**"
      - "build_xframework.sh"
    branches:
      - develop

jobs:
  build-xcframework:
    runs-on: macos-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: mihomo

    steps:
      - name: Checkout mihomo
        uses: actions/checkout@v5
        with:
          path: mihomo

      # mihomo go.mod replaces github.com/playstonex/sing-tun with ../sing-tun,
      # so the fork must be checked out next to it or every go command fails
      # (which surfaced as "go mod tidy failed / missing module declaration").
      - name: Checkout sing-tun (local replace)
        uses: actions/checkout@v5
        with:
          repository: playstonex/sing-tun
          ref: meta
          path: sing-tun

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: mihomo/go.sum

      - name: Install gomobile
        run: |
          # Pin to the last x/mobile revision verified to work with
          # gomobile bind under a go.work workspace (master regressed:
          # "go mod tidy failed / missing module declaration").
          go install golang.org/x/mobile/cmd/gomobile@6873502
          go install golang.org/x/mobile/cmd/gobind@6873502
          gomobile init

      - name: Build XCFramework
        run: |
          chmod +x build_xframework.sh
          ./build_xframework.sh unified

      - name: Zip XCFramework
        run: |
          cd build/xframework
          # Use ditto to avoid __MACOSX metadata entries that confuse Xcode
          ditto -c -k --sequesterRsrc --keepParent Mate.xcframework Mate.xcframework.zip
          echo "ZIP_SIZE=$(du -sh Mate.xcframework.zip | cut -f1)" >> $GITHUB_ENV

      - name: Compute checksum
        run: |
          cd build/xframework
          shasum -a 256 Mate.xcframework.zip > Mate.xcframework.zip.sha256
          cat Mate.xcframework.zip.sha256

      - name: Set release tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "RELEASE_TAG=mate-$(date +'%Y%m%d')-${SHORT_SHA}" >> $GITHUB_ENV
          fi

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Mate XCFramework ${{ env.RELEASE_TAG }}"
          body: |
            Mate.xcframework built from mihomo @ ${{ github.sha }}

            **Size:** ${{ env.ZIP_SIZE }}
            **Platforms:** iOS arm64, iOS Simulator arm64, macOS arm64+x86_64

            ### Usage in Violet
            Update `Violet/library/mate_version.txt` to `${{ env.RELEASE_TAG }}`
          files: |
            mihomo/build/xframework/Mate.xcframework.zip
            mihomo/build/xframework/Mate.xcframework.zip.sha256
          prerelease: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
